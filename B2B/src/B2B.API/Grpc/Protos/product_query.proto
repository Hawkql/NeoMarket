syntax = "proto3";

option csharp_namespace = "B2B.Api.Grpc";

package b2b.product;

service ProductQuery {
  rpc GetProduct (GetProductRequest) returns (ProductResponse);
  rpc GetProductsBatch (GetProductsBatchRequest) returns (ProductsBatchResponse);
}

message GetProductRequest {
  string product_id = 1;
}

message GetProductsBatchRequest {
  repeated string product_ids = 1;
}

message ProductResponse {
  string id = 1;
  string title = 2;
  string description = 3;
  int32 status = 4;
  repeated SkuMessage skus = 5;
}

message ProductsBatchResponse {
  repeated ProductResponse products = 1;
}

message SkuMessage {
  string id = 1;
  string name = 2;
  double price = 3;
  int32 quantity = 4;
}