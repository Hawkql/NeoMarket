version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: b2b-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: b2b
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d b2b"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: b2b-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web UI
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Создаём bucket автоматически при первом запуске.
  # Иначе нужно вручную через MinIO Console (http://localhost:9001).
  minio-init:
    image: minio/mc:latest
    container_name: b2b-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/b2b-images;
      mc anonymous set download local/b2b-images;
      exit 0;
      "

  b2b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__B2BDatabase: "Host=postgres;Database=b2b;Username=postgres;Password=123456789"
      Minio__ServiceUrl: "http://minio:9000"
      Minio__PublicUrlBase: "http://localhost:9000/b2b-images"
      Minio__AccessKey: "minioadmin"
      Minio__SecretKey: "minioadmin"
      Minio__BucketName: "b2b-images"
      Moderation__BaseUrl: "http://moderation:8080"
      Moderation__ServiceKey: "moderation-secret-key-dev"
      B2c__BaseUrl: "http://b2c:8080"
      B2c__ServiceKey: "b2c-secret-key-dev"

volumes:
  postgres_data:
  minio_data: