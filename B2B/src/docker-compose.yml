version: '3.8'

services:
  # ===================== B2B =====================
  postgres:
    image: postgres:16-alpine
    container_name: b2b-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: b2b
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d b2b"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: b2b-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: b2b-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/b2b-images;
      mc anonymous set download local/b2b-images;
      exit 0;
      "

  b2b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: b2b-api
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__B2BDatabase: "Host=postgres;Database=b2b;Username=postgres;Password=123456789"
      Minio__ServiceUrl: "http://minio:9000"
      Minio__PublicUrlBase: "http://localhost:9000/b2b-images"
      Minio__AccessKey: "minioadmin"
      Minio__SecretKey: "minioadmin"
      Minio__BucketName: "b2b-images"
      Moderation__BaseUrl: "http://moderation:8080"
      Moderation__ServiceKey: "moderation-secret-key-dev"
      B2c__BaseUrl: "http://b2c:8080"
      B2c__ServiceKey: "b2c-secret-key-dev"

  # ===================== B2C =====================
  b2c-postgres:
    image: postgres:16-alpine
    container_name: b2c-postgres
    ports:
      - "5433:5432"          # на хосте 5433, чтобы не пересечься с b2b-postgres (5432)
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456789
      POSTGRES_DB: b2c
    volumes:
      - b2c_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d b2c"]
      interval: 5s
      timeout: 5s
      retries: 10

  b2c:
    build:
      context: ../../B2C/src   # путь от ./b2b_src до ./B2C/src — поправь под свою файловую структуру
      dockerfile: Dockerfile
    container_name: b2c-api
    ports:
      - "8083:8080"            # 8083 на хосте — appsettings B2B уже ожидает B2C тут
    depends_on:
      b2c-postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      ConnectionStrings__B2CDatabase: "Host=b2c-postgres;Database=b2c;Username=postgres;Password=123456789"

      ApplyMigrationsOnStartup: "true"   # авто-миграция при старте — удобно для dev/compose

      # JWT — свой секрет B2C, не пересекается с B2B (per-service auth).
      Jwt__Issuer: "neomarket-b2c"
      Jwt__Audience: "neomarket"
      Jwt__Secret: "b2c-jwt-signing-key-must-be-at-least-32-chars-long-dev"
      Jwt__AccessTokenMinutes: "15"
      Jwt__RefreshTokenDays: "30"

      # Outbound на B2B: внутренний DNS docker-compose, имя сервиса "b2b" + порт контейнера 8080.
      # ServiceKey — то, что B2B ожидает на входе (его ServiceKey:Incoming).
      B2BClient__BaseUrl: "http://b2b:8080"
      B2BClient__ServiceKey: "b2b-incoming-service-key-dev"

      # Inbound от B2B: ключ, который мы ожидаем в X-Service-Key
      # (должен совпадать с тем, что B2B шлёт через B2c__ServiceKey выше = b2c-secret-key-dev).
      ServiceKey__Incoming: "b2c-secret-key-dev"

volumes:
  postgres_data:
  minio_data:
  b2c_postgres_data: